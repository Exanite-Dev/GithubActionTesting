name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04

    steps:

      - name: Log context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Create artifact
        run: |
          mkdir builds
          echo "This represents a built binary" > builds/binary.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact
          path: builds
          archive: false

      # This is to see if the workflow has access to secrets
      - name: Leak the benign secret
        run: |
          mkdir secrets
          echo "${{ secrets.BENIGN_SECRET }}" > builds/secret.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: secrets
          path: secrets
          archive: false
