name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04

    steps:

      - name: Log context
        run: echo ${{ toJSON(github) }}

      - name: Create artifact
        run: |
          mkdir builds
          echo "This represents a built binary" > builds/binary.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact
          path: builds
          archive: false
