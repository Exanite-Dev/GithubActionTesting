name: Build (issue_comment)

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.issue.number }}"
  cancel-in-progress: false

jobs:

  # Unprivileged - Should not need to execute untrusted code
  check:
    name: Check PR comment
    runs-on: ubuntu-latest

    if: github.event.issue.pull_request && contains(github.event.comment.body, '/bindings')

    steps:

      - name: Check permission and gather info
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          # Check permissions
          $permission = gh api "repos/$env:BASE_REPO/collaborators/$env:COMMENTER/permission" --jq .user.permissions.push
          if ($permission -ne "true") {
            Write-Host "$env:COMMENTER does not have push permissions"
            exit 0
          }
          
          Write-Host "$env:COMMENTER has push permissions"
          
          $headRepo = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.repo.full_name
          "headRepo=$headRepo" >> $env:GITHUB_OUTPUT
          
          $headBranch = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.ref
          "headBranch=$headBranch" >> $env:GITHUB_OUTPUT
          
          $headCommit = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.sha
          "headCommit=$headCommit" >> $env:GITHUB_OUTPUT

    outputs:
      commentBody: ${{ github.event.comment.body }}
      headRepo: ${{ steps.check.outputs.headRepo }}
      headBranch: ${{ steps.check.outputs.headBranch }}
      headCommit: ${{ steps.check.outputs.headCommit }} # Untrusted: Head may be from a fork

  # Unprivileged - Executes untrusted code (TODO This is currently privileged)
  bundle:
    name: Generate bundle
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [check]

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Create bundle
        id: bundle
        shell: pwsh
        env:
          HEAD_REPO: ${{ needs.check.outputs.headRepo }}
          HEAD_BRANCH: ${{ needs.check.outputs.headBranch }}
          HEAD_COMMIT: ${{ needs.check.outputs.headCommit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git switch -c ci/bindings

          # Cache
          "not actually a cache" >> some-test-cache.stout
          git add some-test-cache.stout
          if (git status --porcelain --untracked-files=no) {
            git commit -m "Update .silktouch cache for $env:HEAD_COMMIT"
          }

          git status

          # Pull in case there were commits pushed since the start of the workflow
          git pull --rebase origin $env:HEAD_BRANCH
          
          $newHeadCommit = git rev-parse FETCH_HEAD
          if ((git rev-parse HEAD) -eq $newHeadCommit) {
            Write-Host "No commits to bundle"
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          git bundle create bindings.bundle "$newHeadCommit..ci/bindings"
          "newHeadCommit=$newHeadCommit" >> $env:GITHUB_OUTPUT
          "changed=true" >> $env:GITHUB_OUTPUT
          
          git push "https://github.com/$env:HEAD_REPO.git" "refs/heads/ci/bindings:refs/heads/$env:HEAD_BRANCH"

      - name: Upload bundle
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-bundle
          path: bindings.bundle
