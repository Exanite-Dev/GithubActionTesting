name: Build Commit

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Commit
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.head_branch != null && github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Update status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }} \
              -f state="pending" \
              -f context="${{ github.workflow }}" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ----- Debugging -----

      - name: Log context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      # This is to see if the workflow has access to secrets
      # From what I understand, this workflow always has access to secrets
      - name: Leak the benign secret
        run: |
          echo "${{ secrets.BENIGN_SECRET }}" > secret.txt

      - name: Upload the benign secret
        uses: actions/upload-artifact@v7.0.1
        with:
          path: secret.txt
          archive: false

      # ----- Actual work -----

      # This can checkout untrusted code from a fork
      - name: Checkout source branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          repository: ${{ github.event.workflow_run.head_repository.full_name }}

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: binaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Commit and push artifacts
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Update binaries for ${{ github.event.workflow_run.head_sha }}" || true
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}

      - name: Update status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }} \
              -f state="${{ job.status }}" \
              -f context="${{ github.workflow }}" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
