name: Build Commit

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: Build Commit
    runs-on: ubuntu-24.04

    steps:

      - name: Log context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      # This is to see if the workflow has access to secrets
      # From what I understand, this workflow always has access to secrets
      - name: Leak the benign secret
        run: |
          echo "${{ secrets.BENIGN_SECRET }}" > secret.txt

      - name: Upload the benign secret
        uses: actions/upload-artifact@v7.0.1
        with:
          path: secret.txt
          archive: false

      # ----- Actual work -----

      # This can checkout untrusted code from a fork
      - name: Checkout latest commit of source branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: binaries
          run-id: ${{ github.event.workflow_run.id }}

      - name: Commit and push artifacts
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Update binaries for $(git rev-parse HEAD)"
          git push
